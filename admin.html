<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginScreen"><div class="login-box"><h1>Portfolio Admin</h1><p>Sign in to manage the portfolio.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signInBtn">Sign In</button><p id="loginMessage"></p></div></div>
<div id="dashboard"><header><div><h1>Portfolio Dashboard</h1><p id="loggedInEmail"></p></div><div><a href="index.html">View Website</a><button id="logoutBtn">Log Out</button></div></header><main>
<section class="panel full"><h2>Profile</h2><label>Full Name</label><input id="fullName"><label>Profession / Job Title</label><input id="profession"><label>Biography</label><textarea id="bio" rows="6"></textarea><label>Years of Experience</label><input id="yearsExperience"><label>Contact Email</label><input id="contactEmail" type="email"><label>Profile Photo</label><input id="profilePhoto" type="file" accept="image/*"><img id="profilePreview" class="profile-preview"><button id="saveProfileBtn">Save Profile</button><p id="profileMessage"></p></section>
<section class="panel"><h2>Achievements</h2><label>Title</label><input id="achievementTitle"><label>Year</label><input id="achievementYear"><label>Description</label><textarea id="achievementDescription" rows="4"></textarea><button id="addAchievementBtn">Add Achievement</button><p id="achievementMessage"></p><hr><div id="achievementsList"></div></section>
<section class="panel"><h2>Posts / Stories</h2><label>Title</label><input id="postTitle"><label>Category</label><input id="postCategory"><label>Content</label><textarea id="postContent" rows="7"></textarea><label>Image</label><input id="postImage" type="file" accept="image/*"><button id="publishPostBtn">Publish Post</button><p id="postMessage"></p><hr><div id="postsList"></div></section>
<section class="panel full"><h2>Gallery</h2><input id="galleryFiles" type="file" accept="image/*" multiple><button id="uploadGalleryBtn">Upload Photos</button><p id="galleryMessage"></p><hr><div id="galleryList"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="admin.js"></script></body></html>
